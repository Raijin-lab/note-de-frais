<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f4e79">
<link rel="manifest" href="manifest.json">
<title>Note de frais | A2CIM</title>
<style>
:root{--b:#1f4e79;--bg:#f4f6f9;--l:#d5dbe3;--t:#1b2430;--success:#28a745;--warn:#ffc107;--danger:#dc3545;}
*{box-sizing:border-box}
body{margin:0;font:15px system-ui,Arial,sans-serif;background:var(--bg);color:var(--t);padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
header{background:var(--b);color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;user-select:none;}
header b{font-size:17px;cursor:pointer;}
main{max-width:900px;margin:auto;padding:12px}
section{background:#fff;border:1px solid var(--l);border-radius:10px;padding:12px;margin-bottom:12px}
h2{margin:0 0 8px;font-size:14px;color:var(--b);text-transform:uppercase}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;align-items:end}
label{font-size:12px;color:#556;display:block;margin-bottom:2px}
input,select,button{font:inherit;padding:8px;border:1px solid var(--l);border-radius:6px;width:100%;background:#fff;color:var(--t)}
input:disabled,select:disabled{background:#e8edf3;color:#888;}
button{background:var(--b);color:#fff;border:0;cursor:pointer;width:auto;transition:opacity 0.2s;}
button:hover{opacity:0.9}
button.s{background:#e8edf3;color:var(--b)}
button.d{background:var(--danger);color:#fff}
button.v{background:var(--success);color:#fff}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:540px}
th,td{border:1px solid var(--l);padding:5px 6px;text-align:left;font-size:13px}th{background:#e8edf3}
.n{text-align:right}.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chips button{background:#e8edf3;color:var(--b);padding:6px 10px;font-size:13px}
.big{font-size:20px;font-weight:700;color:var(--b)}
.badge{padding:4px 8px;border-radius:12px;font-size:11px;font-weight:bold;color:#fff;}
.bg-brouillon{background:#6c757d;} .bg-soumise{background:var(--warn);color:#000;} .bg-validee{background:var(--success);}
.x{padding:2px 8px;background:var(--danger)}
.mode-local-banner{background:var(--warn);color:#000;text-align:center;padding:5px;font-weight:bold;font-size:12px;}
@media print{header,.np,button,.mode-local-banner{display:none!important}body{background:#fff}section{border:0;padding:0}input,select{border:0;padding:0}}
</style>
</head>
<body>
<div id="banner-local" class="mode-local-banner" style="display:none;">🔒 MODE LOCAL PRIVÉ ACTIVÉ (Aucune synchronisation Cloud)</div>
<header><b id="logo-trigger" title="Cliquez 5 fois pour activer/désactiver le mode local">Note de frais</b><span id="us">Chargement...</span></header>
<main id="v"></main>

<script src="config.js?v=3"></script>
<script type="module">
"use strict";

const firebaseConfig = {
  apiKey: "AIzaSyBrakDXYb-vgTTgEoIjwIVaCttRrgwj4aU",
  authDomain: "note-de-frais-a2cim.firebaseapp.com",
  projectId: "note-de-frais-a2cim",
  storageBucket: "note-de-frais-a2cim.firebasestorage.app",
  messagingSenderId: "298324155092",
  appId: "1:298324155092:web:390481b64d14b316383941"
};

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { initializeAppCheck, ReCaptchaEnterpriseProvider } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app-check.js";
import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, doc, setDoc, updateDoc, onSnapshot, query, where } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const PAYS = {"Maroc":"MAD","France":"EUR","Tunisie":"TND"}; 
const CH = ["PETIT DEJEUNER","DEJEUNER","DINER","TRAIN","AUTOROUTES","GASOIL","TAXI","PARKING","HOTEL","RECHARGE","DIVERS"];
const $ = s => document.querySelector(s);
const r2 = n => Math.round((+n + Number.EPSILON) * 100) / 100;
const f2 = n => r2(n).toLocaleString("fr-FR", {minimumFractionDigits:2, maximumFractionDigits:2});
const esc = s => String(s??"").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num = v => parseFloat(String(v).replace(/\s/g,"").replace(",","."));
const fd = d => d ? d.split("-").reverse().join("/") : "";
const today = () => new Date().toISOString().slice(0,10);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,6);

const store = {
  get: (k, d) => { try { const v = JSON.parse(localStorage.getItem(k)); return v == null ? d : v; } catch { return d; } },
  set: (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch { alert("Stockage local plein."); } }
};

const S = {
  notes: store.get("ndf_notes", []),
  id: null,
  profil: store.get("ndf_profil", { nom: "ZOUHAIR BADIS", service: "A2CIM" }),
  isLocalMode: store.get("ndf_local_mode", false)
};

const app = initializeApp(firebaseConfig);

// Initialisation d'App Check avec ta clé reCAPTCHA
const appCheck = initializeAppCheck(app, {
  provider: new ReCaptchaEnterpriseProvider('6LfmmPgtAAAAAFYAuMK-OEHB0M8PlWibs9h94GBJ'),
  isTokenAutoRefreshEnabled: true
});

const auth = getAuth(app);
const db = getFirestore(app);
let unsubscribeSnapshot = null;

let clickCount = 0;
let clickTimer;
$("#logo-trigger").addEventListener("click", () => {
  clickCount++;
  clearTimeout(clickTimer);
  clickTimer = setTimeout(() => { clickCount = 0; }, 2000);
  if (clickCount === 5) {
    S.isLocalMode = !S.isLocalMode;
    store.set("ndf_local_mode", S.isLocalMode);
    alert(S.isLocalMode ? "MODE LOCAL ACTIVÉ : Vos notes sont privées et non synchronisées." : "MODE PARTAGÉ ACTIVÉ : Synchronisation Cloud reprise.");
    location.reload();
  }
});

async function initSync() {
  if (S.isLocalMode) {
    $("#banner-local").style.display = "block";
    $("#us").innerHTML = "Mode Privé Local";
    render();
    return;
  }

  onAuthStateChanged(auth, async (user) => {
    if (user) {
      $("#us").innerHTML = "🟢 Connecté";
      const q = query(collection(db, "notes"), where("supprime", "==", false));
      unsubscribeSnapshot = onSnapshot(q, (snapshot) => {
        const cloudNotes = [];
        snapshot.forEach(doc => cloudNotes.push(doc.data()));
        S.notes = cloudNotes.sort((a,b) => b.upd - a.upd);
        store.set("ndf_notes", S.notes);
        if(!S.id) render(); 
      }, (error) => {
        console.error("Erreur de synchronisation:", error);
      });
    } else {
      $("#us").innerHTML = "🟠 Connexion...";
      try { await signInAnonymously(auth); } catch (e) { console.error("Erreur Auth:", e); }
    }
  });
}

const cur = () => S.notes.find(n => n.id === S.id);
const newNote = () => ({id: uid(), nom: S.profil.nom, service: S.profil.service, du: today(), au: today(), pays: "Maroc", devise: "MAD", taux: 1, objet: "", avances: [], deps: [], statut: "Brouillon", supprime: false, upd: Date.now()});

function calc(n) {
  const loc = n.devise === "MAD", t = loc ? 1 : (+n.taux || 0);
  const dh = n.deps.map(x => x.cur === "X" && !loc ? r2(x.m * t) : r2(x.m));
  const tot = r2(dh.reduce((a, b) => a + b, 0)), av = r2(n.avances.reduce((a, x) => a + +x.m, 0));
  return { loc, t, dh, tot, av, reste: r2(av - tot), dev: t ? r2(tot / t) : 0 };
}

async function persist(n) {
  n.upd = Date.now();
  if (S.isLocalMode) {
    const idx = S.notes.findIndex(x => x.id === n.id);
    if(idx > -1) S.notes[idx] = n; else S.notes.unshift(n);
    store.set("ndf_notes", S.notes);
  } else {
    try {
      const dataToSave = {...n}; delete dataToSave.action_pin; 
      await setDoc(doc(db, "notes", n.id), dataToSave);
    } catch (e) {
      alert("Erreur de sauvegarde Cloud : " + e.message);
    }
  }
  render();
}

function render() {
  const n = cur();
  $("#v").innerHTML = n ? edit(n) : list();
}

function list() {
  const rows = S.notes.filter(n => !n.supprime).map(n => `
    <tr>
      <td>${fd(n.du)}</td>
      <td>${esc(n.nom)} - ${esc(n.objet)}</td>
      <td class="n">${f2(calc(n).tot)}</td>
      <td><span class="badge bg-${n.statut.toLowerCase()}">${n.statut}</span></td>
      <td><button class="s" data-a="open" data-i="${esc(n.id)}">Ouvrir</button></td>
    </tr>`).join("");
  
  return `<section>
    <h2>${S.isLocalMode ? 'Mes notes privées' : 'Toutes les notes de l\'équipe'}</h2>
    <p><button data-a="new">+ Nouvelle note</button></p>
    <div class="tw"><table>
      <tr><th>Date</th><th>Technicien / Objet</th><th class="n">Total DH</th><th>Statut</th><th>Action</th></tr>
      ${rows || '<tr><td colspan="5">Aucune note trouvée.</td></tr>'}
    </table></div>
  </section>`;
}

function edit(n) {
  const c = calc(n), dev = esc(n.devise);
  const locked = n.statut === 'Validée';
  const lockAttr = locked ? "disabled" : "";
  
  const I = (k, l, t="text") => `<div><label>${l}</label><input data-k="${k}" type="${t}" value="${esc(n[k])}" ${lockAttr}></div>`;
  const opts = Object.keys(PAYS).map(p => `<option ${p===n.pays?"selected":""}>${esc(p)}</option>`).join("");
  
  let actionButtons = `<button class="s" data-a="back">← Retour</button>`;
  if (!locked) actionButtons += ` <button class="s" data-a="soumettre">Soumettre</button> <button class="v" data-a="valider">Valider (Patron)</button>`;
  actionButtons += ` <button class="d" data-a="del">Supprimer</button>`;

  const dp = n.deps.map((x, i) => `<tr><td>${fd(x.d)}</td><td>${esc(x.desc)}</td><td class="n">${f2(x.m)}</td><td class="n">${f2(c.dh[i])}</td><td>${locked?'':`<button class="x np" data-a="rmdep" data-i="${i}">×</button>`}</td></tr>`).join("");

  return `<p class="np">${actionButtons}</p>
<section><h2>En-tête de la Note <span class="badge bg-${n.statut.toLowerCase()} float-right">${n.statut}</span></h2>
<div class="g">${I("nom","Nom / Fonction")}${I("service","Service")}${I("du","Du","date")}${I("au","Au","date")}
<div><label>Pays</label><select data-k="pays" ${lockAttr}>${opts}</select></div>${I("objet","Objet de mission")}
</div></section>

<section><h2>Dépenses</h2>
${!locked ? `<div class="np"><div class="chips">${CH.map(x=>`<button data-a="chip" data-v="${x}">${x}</button>`).join("")}</div>
<div class="g"><div><label>Date</label><input id="dt" type="date" value="${esc(n.du)}"></div><div><label>Description</label><input id="dd"></div>
<div><label>Montant</label><input id="dm" inputmode="decimal"></div>
<div><label>Paiement</label><select id="dmo"><option value="cash">Cash</option><option value="carte">Carte</option></select></div>
<div><button data-a="adddep">Ajouter</button></div></div></div>` : ''}
<div class="tw" style="margin-top:8px"><table><tr><th>Date</th><th>Description</th><th class="n">Montant saisi</th><th class="n">Total DH</th><th class="np"></th></tr>${dp}</table></div></section>
<section><h2>Totaux</h2><div class="g">
<div><label>Total dépenses (DH)</label><div class="big">${f2(c.tot)}</div></div></div></section>`;
}

document.addEventListener("click", async e => {
  const b = e.target.closest("[data-a]"); if (!b) return;
  const a = b.dataset.a, n = cur();
  
  try {
    if (a === "new") { const x = newNote(); S.id = x.id; return await persist(x); }
    if (a === "open") { S.id = b.dataset.i; return render(); }
    if (a === "back") { S.id = null; return render(); }
    
    if (!n) return;

    if (a === "chip") { $("#dd").value = b.dataset.v; return $("#dm").focus(); }
    
    if (a === "adddep") {
      const m = num($("#dm").value);
      if (!(m > 0)) return alert("Montant requis.");
      n.deps.push({d: $("#dt").value, desc: $("#dd").value.toUpperCase(), m: r2(m), cur: "DH", mode: $("#dmo").value});
      return await persist(n);
    }
    
    if (a === "rmdep") { n.deps.splice(+b.dataset.i, 1); return await persist(n); }
    
    if (a === "soumettre") {
      n.statut = "Soumise";
      return await persist(n);
    }

    if (a === "valider") {
      if (S.isLocalMode) {
         n.statut = "Validée"; return await persist(n); 
      }
      const pin = prompt("Code secret de validation Patron (PIN) :");
      if (!pin) return;
      try {
        await updateDoc(doc(db, "notes", n.id), { statut: "Validée", action_pin: pin });
        alert("Note validée avec succès.");
      } catch (err) {
        alert("Échec de la validation. Code PIN incorrect ou droits insuffisants.");
      }
    }

    if (a === "del") {
      if (S.isLocalMode) {
        if(confirm("Supprimer la note locale ?")) {
          S.notes = S.notes.filter(x => x.id !== n.id);
          store.set("ndf_notes", S.notes); S.id = null; render();
        }
        return;
      }
      const pin = prompt("Code secret de suppression (PIN) :");
      if (!pin) return;
      try {
        await updateDoc(doc(db, "notes", n.id), { supprime: true, action_pin: pin });
        S.id = null; render();
      } catch (err) {
        alert("Échec de la suppression. Code PIN incorrect.");
      }
    }
  } catch (err) { alert(err.message); }
});

document.addEventListener("change", e => {
  const t = e.target, n = cur(), k = t.dataset?.k;
  if (!n || !k || n.statut === 'Validée') return;
  n[k] = t.value.trim();
  if (k === "nom" || k === "service") { S.profil[k] = n[k]; store.set("ndf_profil", S.profil); }
  persist(n);
});

initSync();
render();
</script>
</body>
</html>
